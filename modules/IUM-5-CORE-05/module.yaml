learningDesign:
  centralQuestion: Wie werden Anweisungen so präzise, dass ein System sie eindeutig ausführen kann?
  goals:
    - Einen Algorithmus als präzise Folge ausführbarer Anweisungen beschreiben
    - Einen grafischen Algorithmus vorhersagen, ausführen und mit einer Laufspur erklären
    - Die erste Abweichung lokalisieren und eine begründete Reparatur prüfen
    - Eine feste Wiederholung passend einsetzen und ihre Modellgrenze benennen
  actions:
    - Alltagshandlungen präzisieren und auf Eindeutigkeit prüfen
    - Algorithmen aus geschlossenen Befehlsblöcken aufbauen
    - Zustände schrittweise vorhersagen und Laufspuren vergleichen
    - Abweichungen mit einer Hypothese gezielt reparieren
    - algorithmische und nichtalgorithmische Systeme an Kurzfällen unterscheiden
  product: Ausführbarer grafischer Algorithmus mit Vorhersage, Belegspur, reparierter Fassung und begründeter Schleifenentscheidung
  misconceptions:
    - Eine für Menschen verständliche Formulierung sei automatisch eindeutig ausführbar
    - Eine Drehung verändere zugleich die Position
    - Jede häufig vorkommende Handlung erfordere eine Wiederholung
    - Eine erfolgreiche Endposition belege ohne Laufspur die Korrektheit jedes Schritts
  scaffolds:
    - Koordinaten- und Szenenbeschreibung
    - Drehhilfe aus aktueller Blickrichtung
    - ausgeschriebene feste Wiederholung
    - Laufspurtabelle mit Vorher- und Nachherzustand
components:
