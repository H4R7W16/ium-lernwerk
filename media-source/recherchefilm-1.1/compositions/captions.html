<!doctype html><html lang="de"><body><template><style>#captions-root{position:absolute;inset:0;width:100%;height:100%;font-family:Montserrat,sans-serif}</style><div data-hf-id="hf-y1fs" id="captions-root" class="caption-root" data-composition-id="captions" data-width="1920" data-height="1080" data-duration="186.867"><p data-hf-id="hf-0alk" id="caption-0" class="clip caption" data-start="0.5" data-duration="2.67" data-track-index="0" data-track-kind="captions">Lea fragt: Leuchtet der Mond selbst?</p><p data-hf-id="hf-6pul" id="caption-1" class="clip caption" data-start="3.925" data-duration="3.145" data-track-index="0" data-track-kind="captions">Sie möchte herausfinden, woher das Licht kommt.</p><p data-hf-id="hf-byco" id="caption-2" class="clip caption" data-start="9.133" data-duration="2.595" data-track-index="0" data-track-kind="captions">Der Browser ist ein Programm für Webseiten.</p><p data-hf-id="hf-q41c" id="caption-3" class="clip caption" data-start="12.471" data-duration="4.082" data-track-index="0" data-track-kind="captions">Die Suchmaschine fragFINN hilft beim Finden von Webseiten.</p><p data-hf-id="hf-ww0o" id="caption-4" class="clip caption" data-start="17.296" data-duration="1.645" data-track-index="0" data-track-kind="captions">Hier ist das Suchfeld.</p><p data-hf-id="hf-8iuy" id="caption-5" class="clip caption" data-start="21.033" data-duration="1.508" data-track-index="0" data-track-kind="captions">Lea sucht nach Mond.</p><p data-hf-id="hf-hkuh" id="caption-6" class="clip caption" data-start="23.283" data-duration="2.658" data-track-index="0" data-track-kind="captions">Ihre eingegebenen Wörter heißen Suchwörter.</p><p data-hf-id="hf-vjjk" id="caption-7" class="clip caption" data-start="26.683" data-duration="2.12" data-track-index="0" data-track-kind="captions">Ein Treffer ist ein Suchergebnis.</p><p data-hf-id="hf-4b1y" id="caption-8" class="clip caption" data-start="29.558" data-duration="2.595" data-track-index="0" data-track-kind="captions">Der erste Titel handelt vom blauen Mond.</p><p data-hf-id="hf-l933" id="caption-9" class="clip caption" data-start="34.233" data-duration="2.058" data-track-index="0" data-track-kind="captions">Welches Wort würdest du ergänzen?</p><p data-hf-id="hf-374o" id="caption-10" class="clip caption" data-start="44.567" data-duration="1.67" data-track-index="0" data-track-kind="captions">Lea ergänzt leuchtet.</p><p data-hf-id="hf-2ln6" id="caption-11" class="clip caption" data-start="46.979" data-duration="4.683" data-track-index="0" data-track-kind="captions">Auch jetzt passt der erste Titel noch nicht: Er handelt von einer Mondfinsternis.</p><p data-hf-id="hf-lf14" id="caption-12" class="clip caption" data-start="52.417" data-duration="1.745" data-track-index="0" data-track-kind="captions">Lea liest weitere Treffer.</p><p data-hf-id="hf-5esi" id="caption-13" class="clip caption" data-start="56.567" data-duration="4.695" data-track-index="0" data-track-kind="captions">Weiter unten findet Lea einen passenden Titel: Warum leuchtet der Mond?</p><p data-hf-id="hf-p8q8" id="caption-14" class="clip caption" data-start="62.004" data-duration="1.295" data-track-index="0" data-track-kind="captions">Sie klickt ihn an.</p><p data-hf-id="hf-5din" id="caption-15" class="clip caption" data-start="64.054" data-duration="2.933" data-track-index="0" data-track-kind="captions">Bei deiner Suche können andere Treffer erscheinen.</p><p data-hf-id="hf-md6w" id="caption-16" class="clip caption" data-start="69.567" data-duration="2.157" data-track-index="0" data-track-kind="captions">Jetzt ist Frag Sophie geöffnet.</p><p data-hf-id="hf-x56c" id="caption-17" class="clip caption" data-start="72.467" data-duration="2.082" data-track-index="0" data-track-kind="captions">Diese Seite ist Leas Quelle.</p><p data-hf-id="hf-q78n" id="caption-18" class="clip caption" data-start="75.292" data-duration="2.582" data-track-index="0" data-track-kind="captions">Lea liest im Text unter dem Comic nach.</p><p data-hf-id="hf-3mml" id="caption-19" class="clip caption" data-start="79.967" data-duration="2.732" data-track-index="0" data-track-kind="captions">Eine Textstelle ist ein Teil des Textes.</p><p data-hf-id="hf-qm16" id="caption-20" class="clip caption" data-start="83.454" data-duration="2.32" data-track-index="0" data-track-kind="captions">Hier stehen zwei kurze Auszüge.</p><p data-hf-id="hf-8h4o" id="caption-21" class="clip caption" data-start="86.517" data-duration="2.545" data-track-index="0" data-track-kind="captions">Angestrahlt heißt: Licht fällt darauf.</p><p data-hf-id="hf-xg2l" id="caption-22" class="clip caption" data-start="89.804" data-duration="2.008" data-track-index="0" data-track-kind="captions">Ein Teleskop ist ein Fernrohr.</p><p data-hf-id="hf-pc4l" id="caption-23" class="clip caption" data-start="99.967" data-duration="1.67" data-track-index="0" data-track-kind="captions">Welche Stelle hilft Lea?</p><p data-hf-id="hf-de88" id="caption-24" class="clip caption" data-start="102.379" data-duration="1.183" data-track-index="0" data-track-kind="captions">Zeige die Wörter.</p><p data-hf-id="hf-wcul" id="caption-25" class="clip caption" data-start="104.304" data-duration="1.708" data-track-index="0" data-track-kind="captions">Warum hilft die andere nicht?</p><p data-hf-id="hf-yu7d" id="caption-26" class="clip caption" data-start="114.267" data-duration="1.095" data-track-index="0" data-track-kind="captions">Lea wählt A.</p><p data-hf-id="hf-2qrq" id="caption-27" class="clip caption" data-start="116.104" data-duration="4.583" data-track-index="0" data-track-kind="captions">Dort steht, dass der Mond nicht selbst leuchtet und Licht von der Sonne bekommt.</p><p data-hf-id="hf-rt5f" id="caption-28" class="clip caption" data-start="121.429" data-duration="3.495" data-track-index="0" data-track-kind="captions">B erklärt, was man mit einem Fernrohr beobachten kann.</p><p data-hf-id="hf-n5y1" id="caption-29" class="clip caption" data-start="128.267" data-duration="2.132" data-track-index="0" data-track-kind="captions">Lea sagt es mit eigenen Worten.</p><p data-hf-id="hf-kajw" id="caption-30" class="clip caption" data-start="131.142" data-duration="2.045" data-track-index="0" data-track-kind="captions">Der Mond wirft Sonnenlicht zurück.</p><p data-hf-id="hf-5a7j" id="caption-31" class="clip caption" data-start="133.929" data-duration="2.533" data-track-index="0" data-track-kind="captions">Dieses Zurückwerfen nennt man Reflexion.</p><p data-hf-id="hf-uf3q" id="caption-32" class="clip caption" data-start="137.204" data-duration="2.02" data-track-index="0" data-track-kind="captions">Dann schreibt sie ihre Antwort auf.</p><p data-hf-id="hf-gp6i" id="caption-33" class="clip caption" data-start="143.267" data-duration="5.62" data-track-index="0" data-track-kind="captions">Lea notiert auch die passende Stelle: erster Textabsatz unter dem Comic, erster Satz.</p><p data-hf-id="hf-435t" id="caption-34" class="clip caption" data-start="149.629" data-duration="3.008" data-track-index="0" data-track-kind="captions">So weiß sie später, wo ihre Antwort herkommt.</p><p data-hf-id="hf-tm5w" id="caption-35" class="clip caption" data-start="154.7" data-duration="1.707" data-track-index="0" data-track-kind="captions">Oben steht die Webadresse.</p><p data-hf-id="hf-nkd5" id="caption-36" class="clip caption" data-start="157.15" data-duration="2.183" data-track-index="0" data-track-kind="captions">Lea kopiert sie in ihre Notiz.</p><p data-hf-id="hf-wnza" id="caption-37" class="clip caption" data-start="160.075" data-duration="2.483" data-track-index="0" data-track-kind="captions">Ein anklickbarer Verweis heißt Link.</p><p data-hf-id="hf-kckj" id="caption-38" class="clip caption" data-start="163.3" data-duration="1.807" data-track-index="0" data-track-kind="captions">Der Seitenname kommt dazu.</p><p data-hf-id="hf-sd0o" id="caption-39" class="clip caption" data-start="168.7" data-duration="2.345" data-track-index="0" data-track-kind="captions">Lea öffnet ihren gespeicherten Link.</p><p data-hf-id="hf-f8z4" id="caption-40" class="clip caption" data-start="171.787" data-duration="2.695" data-track-index="0" data-track-kind="captions">Sie findet die Seite und den ersten Satz wieder.</p><p data-hf-id="hf-zr1f" id="caption-41" class="clip caption" data-start="175.225" data-duration="2.333" data-track-index="0" data-track-kind="captions">Ihre Notiz hilft ihr beim Nachlesen.</p><p data-hf-id="hf-d4zm" id="caption-42" class="clip caption" data-start="179.7" data-duration="2.17" data-track-index="0" data-track-kind="captions">Jetzt suchst du zu rund und Sichel.</p><p data-hf-id="hf-z9zj" id="caption-43" class="clip caption" data-start="182.612" data-duration="2.696" data-track-index="0" data-track-kind="captions">Leas Lichtantwort genügt dafür noch nicht.</p></div><script>window.__timelines['captions']=gsap.timeline({paused:true});</script></template></body></html>
