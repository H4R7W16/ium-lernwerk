name: Reinigungsfall Pages

on:
  workflow_dispatch:
  pull_request:
    paths:
      - prototypes/m06-reinigungsfall/**
      - .github/workflows/reinigungsfall-pages.yml

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 22.20.0
      - name: Check the cleaning model
        run: node --test prototypes/m06-reinigungsfall/reinigungsfall.test.cjs
      - name: Prepare the reviewed static preview
        run: node prototypes/m06-reinigungsfall/build.cjs
      - name: Configure GitHub Pages
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v5
      - name: Upload GitHub Pages artifact
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist/reinigungsfall-pages

  deploy:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    needs: build
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
