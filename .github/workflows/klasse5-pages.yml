name: IuM Lernwerk Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 22.20.0
      - name: Check preserved content and Klasse 6/7
        run: node --test prototypes/shared/*.test.cjs prototypes/m06-reinigungsfall/pages-build.test.cjs prototypes/m06-reinigungsfall/class5-pages.test.cjs prototypes/recherche-beispiel/pages.test.cjs prototypes/pages/pages.test.cjs prototypes/pages/grade-navigation.test.cjs prototypes/klasse7-programmieren/*.test.cjs prototypes/m01-netze/*.test.cjs prototypes/m05-zeichnen/*.test.cjs
      - name: Build existing content and Klasse 6/7
        run: node prototypes/pages/build.cjs
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist/klasse5-pages

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
