name: IUM5 Gate-B preview Pages

on:
  workflow_dispatch:
    inputs:
      acknowledge_non_release:
        description: I acknowledge that this is not a teaching or product release
        required: true
        type: boolean
      preview_id:
        description: Closed Gate-B preview identifier
        required: true
        type: string

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: >-
      github.ref == 'refs/heads/main' &&
      inputs.acknowledge_non_release == true
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22.20.0
          cache: npm
      - name: Validate Preview-ID
        env:
          PREVIEW_ID: ${{ inputs.preview_id }}
        run: node -e "if (!/^ium5-gate-b-[a-z0-9-]{8,48}$/.test(process.env.PREVIEW_ID ?? '')) process.exit(1)"
      - name: Install locked dependencies
        run: npm ci
      - name: Verify IUM5 product baseline
        run: npm run verify:ium5
      - name: Verify Gate-B contract
        run: npm run verify:ium5:gate-b
      - name: Build Gate-B preview
        env:
          IUM_BUILD_REVISION: ${{ github.sha }}
          IUM_PREVIEW_ID: ${{ inputs.preview_id }}
        run: npm run build:gate-b-preview
      - name: Verify build budgets and isolation
        run: npm run quality:build
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: apps/lernwerk-portal/dist

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
