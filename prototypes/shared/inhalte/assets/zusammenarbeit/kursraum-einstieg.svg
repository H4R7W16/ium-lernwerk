<svg xmlns="http://www.w3.org/2000/svg" width="600" height="505" viewBox="0 0 600 505" role="img" aria-labelledby="title desc"><title id="title">Eure Kursraumkarte · vor dem Senden</title><desc id="desc">Vor dem Senden ergänzt die Lehrperson App oder Webadresse, Kurs und Arbeitsgruppe, Leser- und Bearbeitungskreis sowie den Ort für den gemeinsamen Plan.</desc><rect width="600" height="505" rx="14" fill="#f9f7ef"/><g font-family="Arial, sans-serif"><text x="24" y="42" font-size="30" fill="#20342d" font-weight="700">Vier Angaben für euren Einstieg</text><text x="24" y="76" font-size="22" fill="#476056" font-weight="400">Die Lehrperson ergänzt eure echten Angaben.</text><rect x="24" y="100" width="552" height="86" rx="12" fill="#fff" stroke="#bacbc3" stroke-width="2"/><text x="44" y="134" font-size="24" fill="#20342d" font-weight="700">1 · App oder Webadresse</text><text x="44" y="171" font-size="24" fill="#20342d" font-weight="400">________________________________</text><rect x="24" y="198" width="552" height="86" rx="12" fill="#e5f2ec" stroke="#bacbc3" stroke-width="2"/><text x="44" y="232" font-size="24" fill="#20342d" font-weight="700">2 · Kurs und Arbeitsgruppe</text><text x="44" y="269" font-size="24" fill="#20342d" font-weight="400">________________________________</text><rect x="24" y="296" width="552" height="86" rx="12" fill="#fff" stroke="#bacbc3" stroke-width="2"/><text x="44" y="330" font-size="24" fill="#20342d" font-weight="700">3 · Wer darf lesen und bearbeiten?</text><text x="44" y="367" font-size="24" fill="#20342d" font-weight="400">________________________________</text><rect x="24" y="394" width="552" height="86" rx="12" fill="#e5f2ec" stroke="#bacbc3" stroke-width="2"/><text x="44" y="428" font-size="24" fill="#20342d" font-weight="700">4 · Hier entsteht euer gemeinsamer Plan</text><text x="44" y="465" font-size="24" fill="#20342d" font-weight="400">________________________________</text></g></svg>
