<svg xmlns="http://www.w3.org/2000/svg" width="960" height="740" viewBox="0 0 960 740"><title>Digitaler Magazinartikel mit Anzeige zwischen redaktionellen Absätzen</title><rect x="0" y="0" width="960" height="740" rx="24" fill="#f5f3eb"/><rect x="32" y="30" width="896" height="675" rx="20" fill="white"/><rect x="32" y="30" width="896" height="70" rx="20" fill="#306d68"/><text x="62" y="76" fill="white" font-family="Arial,sans-serif" font-size="26" font-weight="bold">WERKSTATT-MAGAZIN · SELBER MACHEN</text><text x="62" y="154" fill="#203c3b" font-family="Arial,sans-serif" font-size="35" font-weight="bold">So faltest du eine Papierbrücke</text><text x="62" y="193" fill="#203c3b" font-family="Arial,sans-serif" font-size="22">Redaktion · Ein Basteltipp</text><text x="62" y="249" fill="#203c3b" font-family="Arial,sans-serif" font-size="28">Falte ein Blatt mehrfach wie eine Ziehharmonika.</text><text x="62" y="290" fill="#203c3b" font-family="Arial,sans-serif" font-size="28">Die Falten können helfen, Gewicht zu tragen.</text><rect x="60" y="325" width="840" height="190" rx="14" fill="#f8e1b5"/><text x="82" y="363" fill="#694924" font-family="Arial,sans-serif" font-size="21" font-weight="bold">ANZEIGE</text><text x="82" y="410" fill="#694924" font-family="Arial,sans-serif" font-size="31" font-weight="bold">Faltfix-Papier macht dich zum Profi!</text><rect x="82" y="441" width="365" height="51" rx="9" fill="#7d5527"/><text x="104" y="475" fill="white" font-family="Arial,sans-serif" font-size="25" font-weight="bold">Jetzt Bastelpaket kaufen</text><text x="62" y="567" fill="#203c3b" font-family="Arial,sans-serif" font-size="28">Lege das gefaltete Blatt auf zwei feste Auflagen.</text><text x="62" y="610" fill="#203c3b" font-family="Arial,sans-serif" font-size="28">Teste vorsichtig, wie viele Münzen es trägt.</text><text x="60" y="681" fill="#53665f" font-family="Arial,sans-serif" font-size="21">Erfundener Unterrichtsfall · IuM-Lernwerk · CC BY-SA 4.0</text></svg>