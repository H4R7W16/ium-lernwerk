<svg xmlns="http://www.w3.org/2000/svg" width="600" height="425" viewBox="0 0 600 425" role="img" aria-labelledby="title desc"><title id="title">Was vor dem Erfolgsbeitrag geschah</title><desc id="desc">Vor dem ausgewählten Erfolgsbeitrag gab es vier Versuche und Hilfe mit einem Falttipp. Der Beitrag zeigt die gelungene Brücke; über den genauen Verlauf jedes einzelnen Versuchs wird nichts behauptet.</desc><rect width="600" height="425" rx="14" fill="#f9f7ef"/><g font-family="Arial, sans-serif"><text x="24" y="42" font-size="30" fill="#20342d" font-weight="700">Mehr als ein ausgewählter Moment</text><text x="24" y="76" font-size="22" fill="#476056" font-weight="400">Erfundener Brückenfall · ergänzender Kontext</text><rect x="24" y="105" width="128" height="111" rx="12" fill="#fff" stroke="#bacbc3" stroke-width="2"/><text x="36" y="148" font-size="22" fill="#20342d" font-weight="400">Versuch</text><text x="72" y="191" font-size="32" fill="#20342d" font-weight="700">1</text><rect x="165" y="105" width="128" height="111" rx="12" fill="#fff" stroke="#bacbc3" stroke-width="2"/><text x="177" y="148" font-size="22" fill="#20342d" font-weight="400">Versuch</text><text x="213" y="191" font-size="32" fill="#20342d" font-weight="700">2</text><rect x="306" y="105" width="128" height="111" rx="12" fill="#fff" stroke="#bacbc3" stroke-width="2"/><text x="318" y="148" font-size="22" fill="#20342d" font-weight="400">Versuch</text><text x="354" y="191" font-size="32" fill="#20342d" font-weight="700">3</text><rect x="447" y="105" width="128" height="111" rx="12" fill="#e5f2ec" stroke="#bacbc3" stroke-width="2"/><text x="459" y="148" font-size="22" fill="#20342d" font-weight="400">Versuch</text><text x="495" y="191" font-size="32" fill="#20342d" font-weight="700">4</text><text x="24" y="263" font-size="26" fill="#20342d" font-weight="400">Dazu: Hilfe mit einem Falttipp</text><text x="280" y="307" font-size="36" fill="#2d52ee" font-weight="700">↓</text><rect x="24" y="331" width="552" height="66" rx="12" fill="#e5f2ec" stroke="#bacbc3" stroke-width="2"/><text x="44" y="373" font-size="27" fill="#20342d" font-weight="700">Im Beitrag: die gelungene Brücke</text></g></svg>
