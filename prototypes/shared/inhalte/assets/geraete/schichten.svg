<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 520" role="img" aria-labelledby="title desc"><title id="title">Wie können Programme dasselbe Gerät nutzen?</title><desc id="desc">Taschenrechner und Browser erfüllen unterschiedliche Aufgaben. Das Betriebssystem organisiert ihren Start und die Nutzung von Bildschirm, Tastatur und Speicher. Zur Hardware gehören auch der Prozessor und weitere innere Bauteile. Die Kästen zeigen Aufgabenbereiche, keine räumlichen Stockwerke.</desc><rect width="640" height="520" rx="18" fill="#f4f7f8"/><g font-family="Arial,sans-serif" fill="#243443"><rect x="20" y="18" width="600" height="131" rx="13" fill="#e3ecd9" stroke="#97ad87"/><text x="40" y="52" font-size="26" font-weight="700">Programme / Apps</text><rect x="40" y="70" width="266" height="59" rx="8" fill="#fff"/><text x="55" y="95" font-size="23" font-weight="700">Taschenrechner</text><text x="55" y="119" font-size="20">Rechnungen bearbeiten</text><rect x="323" y="70" width="276" height="59" rx="8" fill="#fff"/><text x="338" y="95" font-size="23" font-weight="700">Browser</text><text x="338" y="119" font-size="20">Webseiten ansehen</text><path d="M320 156v27m-7-7 7 7 7-7" stroke="#526b5c" stroke-width="3" fill="none"/><rect x="20" y="190" width="600" height="129" rx="13" fill="#e1ebf4" stroke="#8ca8be"/><text x="40" y="225" font-size="26" font-weight="700">Betriebssystem</text><text x="40" y="257" font-size="22">Organisiert den Start von Programmen und</text><text x="40" y="285" font-size="22">die Nutzung der Hardware.</text><text x="40" y="307" font-size="18">Beispiele: Windows oder iPadOS</text><path d="M320 326v27m-7-7 7 7 7-7" stroke="#526b5c" stroke-width="3" fill="none"/><rect x="20" y="360" width="600" height="121" rx="13" fill="#f0e9d7" stroke="#b6a37e"/><text x="40" y="395" font-size="26" font-weight="700">Hardware</text><text x="40" y="428" font-size="22">Die körperlichen Teile: Bildschirm, Tastatur,</text><text x="40" y="457" font-size="22">Prozessor und Speicherbausteine.</text><text x="320" y="507" font-size="18" text-anchor="middle">Ein Modell der Zusammenarbeit, keine Stockwerke im Gerät.</text></g></svg>