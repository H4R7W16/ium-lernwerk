<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="430" viewBox="0 0 1000 430" role="img" aria-label="Erster und überarbeiteter Bibliotheksentwurf"><rect width="100%" height="100%" fill="#f5f4eb"/><rect x="20" y="70" width="450" height="310" rx="12" fill="#fff" stroke="#b9b8ac"/><rect x="500" y="70" width="480" height="310" rx="12" fill="#fff" stroke="#0a7a70"/><text x="25" y="42" font-family="Arial,sans-serif" font-size="20" fill="#183d37">ERSTER ENTWURF</text><text x="505" y="42" font-family="Arial,sans-serif" font-size="20" fill="#183d37">ÜBERARBEITETE KARTE</text><text x="45" y="125" font-family="Arial,sans-serif" font-size="34" fill="#183d37">ALLE BÜCHER</text><text x="45" y="174" font-family="Arial,sans-serif" font-size="42" fill="#a13d20">14 TAGE!</text><path d="M245 206 L258 242 L296 243 L265 267 L276 304 L245 282 L213 304 L224 267 L194 243 L232 242Z" fill="#e2b34f"/><text x="45" y="351" font-family="Arial,sans-serif" font-size="19" fill="#183d37">Auffällig — aber falsch verallgemeinert.</text><text x="525" y="112" font-family="Arial,sans-serif" font-size="30" fill="#183d37">Wie lange ausleihen?</text><text x="525" y="153" font-family="Arial,sans-serif" font-size="22" fill="#183d37">Ab Juni gilt:</text><rect x="528" y="180" width="195" height="100" fill="#e1efe9"/><rect x="746" y="180" width="210" height="100" fill="#f3e5c4"/><text x="545" y="214" font-family="Arial,sans-serif" font-size="24" fill="#183d37">Romane</text><text x="545" y="256" font-family="Arial,sans-serif" font-size="32" fill="#183d37">14 Tage</text><text x="764" y="214" font-family="Arial,sans-serif" font-size="24" fill="#183d37">Sachbücher</text><text x="764" y="256" font-family="Arial,sans-serif" font-size="32" fill="#183d37">7 Tage</text><text x="525" y="316" font-family="Arial,sans-serif" font-size="22" fill="#183d37">Prüfe zuerst die Buchgruppe.</text><text x="525" y="353" font-family="Arial,sans-serif" font-size="19" fill="#183d37">Quelle: erfundene Ordnung ab Juni.</text><text x="25" y="412" font-family="Arial,sans-serif" font-size="16" fill="#183d37">IuM-Lernwerk · eigenes Unterrichtsbeispiel · CC BY-SA 4.0</text></svg>