<svg xmlns="http://www.w3.org/2000/svg" width="600" height="485" viewBox="0 0 600 485" role="img" aria-labelledby="title desc"><title id="title">Versuch 2 · einen Absatz ändern</title><desc id="desc">Vorher liegen die Absätze Buch wählen und Bei der Ausleihe zeigen dicht zusammen. Nach einer Änderung des Absatzabstands steht der nächste Absatz weiter unten. Das Zeichen ¶ zeigt jeweils das Absatzende.</desc><rect width="600" height="485" rx="14" fill="#f9f7ef"/><g font-family="Arial, sans-serif"><text x="24" y="42" font-size="30" fill="#20342d" font-weight="700">2 · Abstand nach einem Absatz</text><rect x="24" y="77" width="552" height="138" rx="12" fill="#fff" stroke="#bacbc3" stroke-width="2"/><text x="44" y="117" font-size="26" fill="#20342d" font-weight="400">Buch wählen. ¶</text><text x="44" y="151" font-size="26" fill="#20342d" font-weight="400">Bei der Ausleihe zeigen. ¶</text><text x="44" y="189" font-size="24" fill="#476056" font-weight="400">Vorher: wenig Abstand</text><text x="280" y="256" font-size="36" fill="#2d52ee" font-weight="700">↓</text><rect x="24" y="282" width="552" height="165" rx="12" fill="#e5f2ec" stroke="#bacbc3" stroke-width="2"/><text x="44" y="326" font-size="26" fill="#20342d" font-weight="400">Buch wählen. ¶</text><text x="44" y="399" font-size="26" fill="#20342d" font-weight="400">Bei der Ausleihe zeigen. ¶</text><text x="24" y="472" font-size="22" fill="#476056" font-weight="400">¶ zeigt das Ende eines Absatzes.</text></g></svg>
