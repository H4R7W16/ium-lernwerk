<svg xmlns="http://www.w3.org/2000/svg" width="600" height="655" viewBox="0 0 600 655" role="img" aria-labelledby="title desc"><title id="title">Vom Suchfeld zur Fundseite</title><desc id="desc">Oben liegt die Adresszeile des Browsers. Auf der Suchdienst-Seite wird Lindenort Samstag Öffnungszeiten eingegeben. Ein Ergebnis hat Titel, Adresse und kurzen Treffertext. Über den Titel wird erst die Fundseite geöffnet.</desc><rect width="600" height="655" rx="14" fill="#f9f7ef"/><g font-family="Arial, sans-serif"><text x="24" y="42" font-size="30" fill="#20342d" font-weight="700">1 · Im Browser suchen</text><text x="24" y="75" font-size="22" fill="#476056" font-weight="400">Übungsdarstellung · keine echte Website</text><rect x="24" y="96" width="552" height="204" rx="12" fill="#fff" stroke="#bacbc3" stroke-width="2"/><rect x="24" y="96" width="552" height="48" rx="12" fill="#e5eaff" stroke="#bacbc3" stroke-width="2"/><text x="42" y="129" font-size="24" fill="#20342d" font-weight="700">Browser · Adresszeile oben</text><text x="44" y="181" font-size="26" fill="#20342d" font-weight="400">Seite eines Suchdienstes</text><rect x="44" y="203" width="512" height="70" rx="12" fill="#fff" stroke="#bacbc3" stroke-width="2"/><text x="60" y="246" font-size="24" fill="#20342d" font-weight="400">Lindenort Samstag Öffnungszeiten</text><text x="280" y="342" font-size="36" fill="#2d52ee" font-weight="700">↓</text><text x="24" y="380" font-size="30" fill="#20342d" font-weight="700"></text><text x="24" y="380" font-size="28" fill="#20342d" font-weight="700">2 · Einen passenden Treffer öffnen</text><rect x="24" y="406" width="552" height="201" rx="12" fill="#fff" stroke="#bacbc3" stroke-width="2"/><text x="44" y="449" font-size="26" fill="#2d52ee" font-weight="700">Öffnungszeiten · Stadtbücherei</text><text x="44" y="491" font-size="24" fill="#20342d" font-weight="400">buecherei.example/oeffnungszeiten</text><text x="44" y="538" font-size="24" fill="#20342d" font-weight="400">„Samstag 10–13 Uhr …“</text><text x="44" y="572" font-size="24" fill="#20342d" font-weight="400">Treffertext: nur ein Hinweis!</text><text x="24" y="642" font-size="22" fill="#476056" font-weight="400">Tippe auf den Titel, um die Fundseite zu lesen.</text></g></svg>
