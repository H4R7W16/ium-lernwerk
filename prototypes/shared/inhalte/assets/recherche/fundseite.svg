<svg xmlns="http://www.w3.org/2000/svg" width="600" height="475" viewBox="0 0 600 475" role="img" aria-labelledby="title desc"><title id="title">Auf der Fundseite den Beleg finden</title><desc id="desc">Die erfundene Originalseite nennt den Titel Öffnungszeiten, den Anbieter Stadtbücherei Lindenort und den Satz Samstag 10 bis 13 Uhr. Ein Veröffentlichungsdatum ist nicht angegeben. Hinweise auf Ausnahmen bleiben zu prüfen.</desc><rect width="600" height="475" rx="14" fill="#f9f7ef"/><g font-family="Arial, sans-serif"><text x="24" y="42" font-size="30" fill="#20342d" font-weight="700">3 · Jetzt die Fundseite lesen</text><text x="24" y="76" font-size="22" fill="#476056" font-weight="400">Erfundene Seite der Stadtbücherei</text><rect x="24" y="100" width="552" height="264" rx="12" fill="#fff" stroke="#bacbc3" stroke-width="2"/><text x="44" y="144" font-size="30" fill="#20342d" font-weight="700">① Öffnungszeiten</text><text x="44" y="181" font-size="26" fill="#20342d" font-weight="400">② Stadtbücherei Lindenort</text><rect x="40" y="204" width="520" height="70" rx="12" fill="#e5f2ec" stroke="#bacbc3" stroke-width="2"/><text x="56" y="245" font-size="26" fill="#20342d" font-weight="700">③ Samstag: 10 bis 13 Uhr.</text><text x="44" y="308" font-size="24" fill="#20342d" font-weight="400">Prüfe auch Hinweise auf Ausnahmen.</text><text x="44" y="342" font-size="24" fill="#20342d" font-weight="400">Veröffentlichungsdatum: nicht angegeben.</text><text x="24" y="405" font-size="26" fill="#20342d" font-weight="400">Quellenkarte: ① Titel · ② Anbieter</text><text x="24" y="439" font-size="26" fill="#20342d" font-weight="400">③ Fundstelle und eigene Aussage</text></g></svg>
