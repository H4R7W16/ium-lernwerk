<svg xmlns="http://www.w3.org/2000/svg" width="880" height="420" viewBox="0 0 880 420"><rect width="100%" height="100%" rx="24" fill="#edf6f4"/><g font-family="Arial,sans-serif" fill="#17312d"><text x="40" y="55" font-size="30" font-weight="bold">Eine Idee wird zum Musterband</text><text x="40" y="95" font-size="22">Drei gleiche Motive – selbst geplant.</text><path d="M70 150h100v65h100v65h100v65" fill="none" stroke="#0a7a70" stroke-width="10"/><circle cx="70" cy="150" r="9" fill="#ac4100"/><text x="440" y="160" font-size="24">Jedes Motiv führt weiter.</text><text x="440" y="205" font-size="22">Danach schaut der Stift</text><text x="440" y="240" font-size="22">wieder nach rechts.</text><path d="M480 285h90v65" fill="none" stroke="#647b76" stroke-width="7"/><text x="600" y="305" font-size="20">Leas einzelnes L:</text><text x="600" y="335" font-size="20">unser anderes Beispiel</text></g></svg>
