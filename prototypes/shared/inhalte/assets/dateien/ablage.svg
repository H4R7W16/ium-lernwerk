<svg xmlns="http://www.w3.org/2000/svg" width="540" height="390" viewBox="0 0 540 390" role="img" aria-labelledby="title desc">
<title id="title">Ein Ordnerweg zur Fundnotiz</title><desc id="desc">Vom vereinbarten Startort über Lernwerk und Fundbüro zur Datei fundnotiz.txt. In der Datei steht der Text.</desc>
