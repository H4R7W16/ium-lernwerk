<svg xmlns="http://www.w3.org/2000/svg" width="600" height="420" viewBox="0 0 600 420" role="img" aria-labelledby="title desc"><title id="title">Vorschau und gespeicherte Datei</title><desc id="desc">Die Anzeige im Browser zeigt zunächst eine Vorschau. Der Ablagenachweis ist das Öffnen von fundnotiz.txt aus dem eigenen Ordner und das Finden von BLAU-17.</desc><rect width="600" height="420" rx="14" fill="#f9f7ef"/><g font-family="Arial, sans-serif"><text x="24" y="42" font-size="30" fill="#20342d" font-weight="700">Kannst du sie aus dem Ordner öffnen?</text><rect x="24" y="75" width="552" height="116" rx="12" fill="#fff" stroke="#bacbc3" stroke-width="2"/><text x="44" y="116" font-size="26" fill="#20342d" font-weight="400">Im Browser: Fundnotiz wird angezeigt.</text><text x="44" y="150" font-size="26" fill="#20342d" font-weight="400">Das ist zunächst nur eine Vorschau.</text><text x="280" y="235" font-size="36" fill="#2d52ee" font-weight="700">↓</text><rect x="24" y="266" width="552" height="125" rx="12" fill="#e5f2ec" stroke="#bacbc3" stroke-width="2"/><text x="44" y="307" font-size="26" fill="#20342d" font-weight="400">Im eigenen Ordner: fundnotiz.txt öffnen.</text><text x="44" y="341" font-size="26" fill="#20342d" font-weight="400">Inhalt prüfen: BLAU-17</text><text x="44" y="375" font-size="26" fill="#20342d" font-weight="400">Jetzt hast du den Ablageweg geprüft.</text></g></svg>
