<svg xmlns="http://www.w3.org/2000/svg" width="600" height="430" viewBox="0 0 600 430" role="img" aria-labelledby="title desc"><title id="title">Zwei Geräte, derselbe Ordnername</title><desc id="desc">Heute liegt entwurf.txt im Ordner Projekt auf Gerät 1. Auf Gerät 2 heißt ein Ordner ebenfalls Projekt. Ob dort die Datei vorhanden ist, ist noch unbekannt.</desc><rect width="600" height="430" rx="14" fill="#f9f7ef"/><g font-family="Arial, sans-serif"><text x="24" y="42" font-size="30" fill="#20342d" font-weight="700">Was weißt du schon – was fehlt?</text><rect x="24" y="68" width="552" height="145" rx="12" fill="#fff" stroke="#bacbc3" stroke-width="2"/><text x="44" y="104" font-size="26" fill="#20342d" font-weight="700">Heute · Schulgerät 1</text><path d="M44 129v-12h48l14 12h105v72H44Z" fill="#f4d48b" stroke="#86692b" stroke-width="2"/><text x="58" y="166" font-size="26" fill="#20342d" font-weight="400">Projekt</text><rect x="264" y="130" width="205" height="64" rx="12" fill="#e5f2ec" stroke="#bacbc3" stroke-width="2"/><text x="276" y="170" font-size="24" fill="#20342d" font-weight="400">entwurf.txt</text><rect x="24" y="235" width="552" height="162" rx="12" fill="#fff" stroke="#bacbc3" stroke-width="2"/><text x="44" y="271" font-size="26" fill="#20342d" font-weight="700">Morgen · Schulgerät 2</text><path d="M44 299v-12h48l14 12h105v72H44Z" fill="#f4d48b" stroke="#86692b" stroke-width="2"/><text x="58" y="336" font-size="26" fill="#20342d" font-weight="400">Projekt</text><text x="276" y="337" font-size="26" fill="#2d52ee" font-weight="700">Datei vorhanden?</text></g></svg>
