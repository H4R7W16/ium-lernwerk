<svg xmlns="http://www.w3.org/2000/svg" width="600" height="380" viewBox="0 0 600 380" role="img" aria-labelledby="title desc"><title id="title">A · auf einem Gerät gespeichert</title><desc id="desc">Die Datei liegt nur im eigenen Bereich auf Schulgerät 1; auf Gerät 2 ist sie nicht vorhanden.</desc><rect width="600" height="380" rx="14" fill="#f9f7ef"/><g font-family="Arial, sans-serif"><text x="24" y="42" font-size="30" fill="#20342d" font-weight="700">A · Die Datei liegt auf Gerät 1</text><rect x="24" y="74" width="552" height="114" rx="12" fill="#e5f2ec" stroke="#bacbc3" stroke-width="2"/><text x="44" y="112" font-size="26" fill="#20342d" font-weight="700">Schulgerät 1 · eigener Bereich</text><rect x="44" y="122" width="205" height="64" rx="12" fill="#e5f2ec" stroke="#bacbc3" stroke-width="2"/><text x="56" y="162" font-size="24" fill="#20342d" font-weight="400">entwurf.txt</text><rect x="24" y="215" width="552" height="114" rx="12" fill="#fff" stroke="#bacbc3" stroke-width="2"/><text x="44" y="253" font-size="26" fill="#20342d" font-weight="700">Schulgerät 2 · eigener Bereich</text><text x="44" y="297" font-size="26" fill="#20342d" font-weight="400">Hier liegt diese Datei nicht.</text><text x="24" y="360" font-size="22" fill="#476056" font-weight="400">Lokal = auf diesem Gerät</text></g></svg>
