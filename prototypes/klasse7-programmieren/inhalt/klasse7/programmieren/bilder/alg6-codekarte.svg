<title id="title">Meine Codekarte – Haltestelle 50</title><desc id="desc">Ergänzbarer grafischer Ablauf: Start, feste Wiederholung, Abbruchfrage vor der Bewegung mit Rückweg, Verzweigung und zwei Meldungen. Rechts kurze Wertnotizen und Varianten. Die Positionen und Bedingungsausgänge sind selbst einzutragen.</desc>
