<svg xmlns="http://www.w3.org/2000/svg" width="640" height="300" viewBox="0 0 640 300" role="img" aria-labelledby="title desc"><title id="title">Flach oder erhöht?</title><desc id="desc">Zwei Oberflächen im Querschnitt: flache Druckpunkte und drei erhabene Punkte. Keine Braillezeichen.</desc><rect width="640" height="300" rx="16" fill="#E8F4F2"/><g font-family="sans-serif" fill="#163B37"><text x="28" y="38" font-size="25">Was kann der Finger ertasten?</text><text x="28" y="85" font-size="21">Gedruckte Punkte: flach</text><path d="M28 120 H612" stroke="#163B37" stroke-width="3"/><path d="M150 117 H172 M310 117 H332 M470 117 H492" stroke="#163B37" stroke-width="6"/><text x="28" y="182" font-size="21">Erhöhte Punkte: ragen über die Fläche</text><path d="M28 232 H146 Q161 188 176 232 H306 Q321 188 336 232 H466 Q481 188 496 232 H612" fill="none" stroke="#0A7A70" stroke-width="4"/><text x="28" y="278" font-size="18">Seitenansicht · Schema, keine Braillezeichen</text></g></svg>