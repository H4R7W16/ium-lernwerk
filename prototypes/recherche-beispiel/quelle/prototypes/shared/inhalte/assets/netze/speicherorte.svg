<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 400"><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10" fill="#0A7A70"/></marker></defs><rect width="100%" height="100%" rx="18" fill="#edf7f5"/><g font-family="Arial, sans-serif" fill="#223436"><text x="20" y="35" font-size="22">Wo liegt die Datei?</text><rect x="20" y="55" width="400" height="125" rx="12" fill="white" stroke="#0A7A70"/><text x="38" y="87" font-size="24">Auf meinem Gerät K</text><rect x="40" y="106" width="27" height="38" fill="#e3f2ef" stroke="#0A7A70"/><text x="85" y="132" font-size="22">Dateikopie auf K</text><text x="38" y="163" font-size="20">Kein Netzweg nötig.</text><rect x="20" y="202" width="400" height="174" rx="12" fill="white" stroke="#0A7A70"/><text x="38" y="234" font-size="24">Auf einem anderen Gerät</text><path d="M98 282 L335 282" stroke="#0A7A70" stroke-width="4" fill="none" marker-end="url(#arrow)"/><circle cx="74" cy="282" r="23" fill="white" stroke="#0A7A70" stroke-width="3"/><text x="74" y="290" text-anchor="middle" font-size="26" font-weight="700">K</text><circle cx="367" cy="282" r="23" fill="white" stroke="#0A7A70" stroke-width="3"/><text x="367" y="290" text-anchor="middle" font-size="26" font-weight="700">L</text><text x="125" y="267" font-size="20">Netzweg</text><text x="38" y="332" font-size="21">K fragt an. L bietet die Datei an.</text><text x="38" y="360" font-size="20">Weg und Dienst werden gebraucht.</text></g></svg>