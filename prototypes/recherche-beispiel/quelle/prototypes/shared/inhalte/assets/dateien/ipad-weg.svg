<svg xmlns="http://www.w3.org/2000/svg" width="600" height="430" viewBox="0 0 600 430" role="img" aria-labelledby="title desc"><title id="title">iPad · Dateien wiedererkennen</title><desc id="desc">Schematisches iPad · Dateien wiedererkennen: Zuerst den erlaubten Startort der Schule öffnen. Danach einen eigenen Ordner anlegen. Die gespeicherte Fundnotiz wird aus dem Themenordner geöffnet.</desc><rect width="600" height="430" rx="14" fill="#f9f7ef"/><g font-family="Arial, sans-serif"><text x="24" y="42" font-size="30" fill="#20342d" font-weight="700">iPad · Dateien wiedererkennen</text><text x="24" y="76" font-size="22" fill="#476056" font-weight="400">Bedienmodell · dein Schulort kann anders heißen</text><rect x="24" y="102" width="552" height="174" rx="12" fill="#fff" stroke="#bacbc3" stroke-width="2"/><text x="44" y="141" font-size="26" fill="#20342d" font-weight="700">Dateien · Durchsuchen</text><rect x="44" y="160" width="512" height="64" rx="12" fill="#e5f2ec" stroke="#bacbc3" stroke-width="2"/><text x="60" y="202" font-size="26" fill="#20342d" font-weight="400">Startort deiner Schule</text><text x="44" y="252" font-size="24" fill="#20342d" font-weight="400">Mehr (…) → Neuer Ordner</text><text x="280" y="318" font-size="36" fill="#2d52ee" font-weight="700">↓</text><path d="M44 341v-12h48l14 12h105v72H44Z" fill="#f4d48b" stroke="#86692b" stroke-width="2"/><text x="58" y="378" font-size="26" fill="#20342d" font-weight="400">Fundbüro</text><rect x="264" y="343" width="205" height="64" rx="12" fill="#e5f2ec" stroke="#bacbc3" stroke-width="2"/><text x="276" y="383" font-size="24" fill="#20342d" font-weight="400">fundnotiz.txt</text></g></svg>
