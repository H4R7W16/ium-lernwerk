<svg xmlns="http://www.w3.org/2000/svg" width="600" height="630" viewBox="0 0 600 630" role="img" aria-labelledby="title desc"><title id="title">Name, Ort oder zusätzliche Kopie?</title><desc id="desc">Umbenennen ändert fundnotiz.txt zu flasche.txt im selben Ordner. Verschieben verlegt fundnotiz.txt von Downloads nach Fundbüro. Kopieren lässt die Datei in Downloads und erstellt eine weitere in Fundbüro.</desc><rect width="600" height="630" rx="14" fill="#f9f7ef"/><g font-family="Arial, sans-serif"><text x="24" y="42" font-size="30" fill="#20342d" font-weight="700">Drei unterschiedliche Änderungen</text><rect x="24" y="72" width="552" height="148" rx="12" fill="#fff" stroke="#bacbc3" stroke-width="2"/><text x="44" y="111" font-size="26" fill="#20342d" font-weight="700">Umbenennen · Name ändert sich</text><text x="44" y="153" font-size="24" fill="#20342d" font-weight="400">Fundbüro / fundnotiz.txt</text><text x="44" y="187" font-size="24" fill="#20342d" font-weight="400">→ Fundbüro / flasche.txt</text><rect x="24" y="240" width="552" height="148" rx="12" fill="#e5f2ec" stroke="#bacbc3" stroke-width="2"/><text x="44" y="279" font-size="26" fill="#20342d" font-weight="700">Verschieben · Ort ändert sich</text><text x="44" y="321" font-size="24" fill="#20342d" font-weight="400">Downloads / fundnotiz.txt</text><text x="44" y="355" font-size="24" fill="#20342d" font-weight="400">→ Fundbüro / fundnotiz.txt</text><rect x="24" y="408" width="552" height="170" rx="12" fill="#fff" stroke="#bacbc3" stroke-width="2"/><text x="44" y="447" font-size="26" fill="#20342d" font-weight="700">Kopieren · zweite Datei entsteht</text><text x="44" y="489" font-size="24" fill="#20342d" font-weight="400">Downloads / fundnotiz.txt bleibt.</text><text x="44" y="523" font-size="24" fill="#20342d" font-weight="400">Zusätzlich: Fundbüro / fundnotiz.txt</text><text x="24" y="610" font-size="22" fill="#476056" font-weight="400">Gleiche Inhalte können an zwei Orten liegen.</text></g></svg>
