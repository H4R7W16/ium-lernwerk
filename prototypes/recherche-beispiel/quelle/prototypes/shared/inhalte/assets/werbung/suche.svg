<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 420" role="img" aria-labelledby="title"><title id="title">A · Werbung in einer Suchliste</title><g font-family="Arial, sans-serif"><rect x="0" y="0" width="480" height="420" rx="0" fill="#F3F6F5"/><text x="24" y="45" font-size="32" font-weight="700" fill="#182F33">Suche: Stifte</text><rect x="20" y="68" width="440" height="215" rx="12" fill="#FFFFFF"/><text x="36" y="108" font-size="30" font-weight="700" fill="#0A7A70">Anzeige</text><text x="36" y="155" font-size="38" font-weight="700" fill="#182F33">Farbladen</text><text x="36" y="198" font-size="30" font-weight="400" fill="#182F33">Stifte für deine Ideen</text><rect x="36" y="216" width="338" height="48" rx="12" fill="#0A7A70"/><text x="52" y="250" font-size="30" font-weight="700" fill="#FFFFFF">Angebot ansehen →</text><text x="28" y="329" font-size="30" font-weight="700" fill="#182F33">Darunter: Suchtreffer</text><text x="28" y="374" font-size="30" font-weight="400" fill="#182F33">So entsteht Bleistift.</text></g></svg>
