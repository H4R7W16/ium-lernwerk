<svg xmlns="http://www.w3.org/2000/svg" width="480" height="154" viewBox="0 0 480 154" role="img" aria-labelledby="title desc"><title id="title">Vom Text zum Suchtreffer</title><desc id="desc">Texte werden erfasst und ergeben den Index. Eine Anfrage an den Index liefert Treffer. Ändert sich ein Text, muss der Index neu erfasst werden.</desc><rect width="480" height="154" rx="12" fill="#F7F7F2"/><text x="240" y="31" text-anchor="middle" font-family="Arial,sans-serif" font-size="26" font-weight="bold" fill="#153A36">Der Weg zum Suchtreffer</text><g fill="white" stroke="#0A7A70" stroke-width="2"><rect x="8" y="54" width="132" height="68" rx="9"/><rect x="174" y="54" width="132" height="68" rx="9"/><rect x="340" y="54" width="132" height="68" rx="9"/></g><g fill="#153A36" text-anchor="middle" font-family="Arial,sans-serif" font-size="32" font-weight="bold"><text x="74" y="100">Texte</text><text x="240" y="100">Index</text><text x="406" y="100">Treffer</text></g><g stroke="#0A7A70" stroke-width="3" fill="none"><path d="M146 88h22m-7-7 7 7-7 7"/><path d="M312 88h22m-7-7 7 7-7 7"/></g></svg>