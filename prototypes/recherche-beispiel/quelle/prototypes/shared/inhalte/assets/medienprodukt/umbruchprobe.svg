<svg xmlns="http://www.w3.org/2000/svg" width="600" height="655" viewBox="0 0 600 655" role="img" aria-labelledby="title desc"><title id="title">Versuch 3 · Zeile oder Absatz?</title><desc id="desc">A bricht ohne Tasteneingabe am Rand um und hat ein Absatzende. B setzt einen manuellen Zeilenumbruch, Zeichen ↵, im selben Absatz. C hat zwei Absatzenden, Zeichen ¶, und kann einen eigenen Absatzabstand erhalten.</desc><rect width="600" height="655" rx="14" fill="#f9f7ef"/><g font-family="Arial, sans-serif"><text x="24" y="42" font-size="30" fill="#20342d" font-weight="700">3 · Drei verschiedene Zeilenwechsel</text><rect x="24" y="77" width="552" height="145" rx="12" fill="#fff" stroke="#bacbc3" stroke-width="2"/><text x="44" y="114" font-size="25" fill="#20342d" font-weight="700">A · automatisch am rechten Rand</text><text x="44" y="160" font-size="26" fill="#20342d" font-weight="400">Bei der Ausleihe zeigen.</text><text x="44" y="194" font-size="26" fill="#20342d" font-weight="400">Rückgabedatum merken. ¶</text><rect x="24" y="244" width="552" height="145" rx="12" fill="#e5f2ec" stroke="#bacbc3" stroke-width="2"/><text x="44" y="281" font-size="25" fill="#20342d" font-weight="700">B · manuell · im selben Absatz</text><text x="44" y="327" font-size="26" fill="#20342d" font-weight="400">Bei der Ausleihe zeigen. ↵</text><text x="44" y="361" font-size="26" fill="#20342d" font-weight="400">Rückgabedatum merken. ¶</text><rect x="24" y="411" width="552" height="166" rx="12" fill="#fff" stroke="#bacbc3" stroke-width="2"/><text x="44" y="448" font-size="25" fill="#20342d" font-weight="700">C · neuer Absatz</text><text x="44" y="492" font-size="26" fill="#20342d" font-weight="400">Bei der Ausleihe zeigen. ¶</text><text x="44" y="551" font-size="26" fill="#20342d" font-weight="400">Rückgabedatum merken. ¶</text><text x="24" y="609" font-size="22" fill="#20342d" font-weight="400">↵ neuer Zeilenanfang · ¶ Absatzende</text><text x="24" y="643" font-size="22" fill="#20342d" font-weight="400">Die Zeichen werden gewöhnlich nicht gedruckt.</text></g></svg>
