<svg xmlns="http://www.w3.org/2000/svg" width="600" height="490" viewBox="0 0 600 490" role="img" aria-labelledby="title desc"><title id="title">Original, Lesekopie und Link</title><desc id="desc">Das bearbeitbare Original bleibt für Änderungen. Eine abgegebene PDF-Lesekopie wird durch spätere Änderungen am Original nicht automatisch aktualisiert. Ein Link verweist auf den freigegebenen Stand; Leserechte hängen von der Freigabe ab.</desc><rect width="600" height="490" rx="14" fill="#f9f7ef"/><g font-family="Arial, sans-serif"><text x="24" y="42" font-size="30" fill="#20342d" font-weight="700">Welche Fassung gibst du weiter?</text><rect x="24" y="70" width="552" height="100" rx="12" fill="#e5f2ec" stroke="#bacbc3" stroke-width="2"/><text x="44" y="108" font-size="26" fill="#20342d" font-weight="400">Original · zum Bearbeiten</text><text x="44" y="142" font-size="26" fill="#20342d" font-weight="400">Hier änderst du später Text und Bilder.</text><rect x="24" y="198" width="552" height="111" rx="12" fill="#fff" stroke="#bacbc3" stroke-width="2"/><text x="44" y="237" font-size="25" fill="#20342d" font-weight="400">PDF / Lesekopie · zum Lesen</text><text x="44" y="271" font-size="25" fill="#20342d" font-weight="400">Spätere Änderungen im Original</text><text x="44" y="305" font-size="25" fill="#20342d" font-weight="400">ändern diese abgegebene Kopie nicht.</text><rect x="24" y="337" width="552" height="120" rx="12" fill="#fff" stroke="#bacbc3" stroke-width="2"/><text x="44" y="375" font-size="25" fill="#20342d" font-weight="400">Link · öffnet den freigegebenen Stand</text><text x="44" y="409" font-size="25" fill="#20342d" font-weight="400">Wer öffnen darf, bestimmt die Freigabe.</text><text x="44" y="443" font-size="25" fill="#20342d" font-weight="400">Ein Link allein gibt niemandem Leserecht.</text></g></svg>
