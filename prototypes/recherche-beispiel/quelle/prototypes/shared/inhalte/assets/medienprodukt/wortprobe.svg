<svg xmlns="http://www.w3.org/2000/svg" width="600" height="320" viewBox="0 0 600 320" role="img" aria-labelledby="title desc"><title id="title">Versuch 1 · nur ein Wort ändern</title><desc id="desc">Vorher ist nur das Wort Buch ausgewählt. Nach dem Befehl Fett ist Buch fett und wählen. bleibt unverändert.</desc><rect width="600" height="320" rx="14" fill="#f9f7ef"/><g font-family="Arial, sans-serif"><text x="24" y="42" font-size="30" fill="#20342d" font-weight="700">1 · Was soll fett werden?</text><rect x="24" y="78" width="552" height="86" rx="12" fill="#fff" stroke="#bacbc3" stroke-width="2"/><rect x="42" y="92" width="76" height="53" rx="12" fill="#dbe3ff" stroke="#bacbc3" stroke-width="2"/><text x="46" y="128" font-size="26" fill="#20342d" font-weight="400">Buch</text><text x="128" y="128" font-size="26" fill="#20342d" font-weight="400">wählen.</text><text x="44" y="206" font-size="26" fill="#2d52ee" font-weight="700">Auswahl prüfen → Fett</text><rect x="24" y="231" width="552" height="64" rx="12" fill="#e5f2ec" stroke="#bacbc3" stroke-width="2"/><text x="44" y="272" font-size="26" fill="#20342d" font-weight="700">Buch</text><text x="128" y="272" font-size="26" fill="#20342d" font-weight="400">wählen.</text></g></svg>
