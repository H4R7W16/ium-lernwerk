<svg xmlns="http://www.w3.org/2000/svg" width="600" height="705" viewBox="0 0 600 705" role="img" aria-labelledby="title desc"><title id="title">Vom Vorschlag zur besseren Überschrift</title><desc id="desc">Vorher lautet die Überschrift Der Schatten. Jona fragt nach. Mika unterscheidet mit E2 Mondphase und Mondfinsternis. Jona ändert die Überschrift zu Mondphase oder Mondfinsternis.</desc><rect width="600" height="705" rx="14" fill="#f9f7ef"/><g font-family="Arial, sans-serif"><text x="24" y="42" font-size="30" fill="#20342d" font-weight="700">Ein Austausch verändert das Produkt</text><rect x="24" y="77" width="552" height="99" rx="12" fill="#fff" stroke="#bacbc3" stroke-width="2"/><text x="44" y="114" font-size="24" fill="#476056" font-weight="400">Vorher · Überschrift im Plan</text><text x="44" y="155" font-size="30" fill="#20342d" font-weight="700">Der Schatten</text><rect x="24" y="204" width="505" height="92" rx="12" fill="#e5eaff" stroke="#bacbc3" stroke-width="2"/><text x="44" y="242" font-size="25" fill="#20342d" font-weight="400">Jona: Passt „Der Schatten“</text><text x="44" y="276" font-size="25" fill="#20342d" font-weight="400">zu deiner Quelle?</text><rect x="71" y="320" width="505" height="112" rx="12" fill="#e5f2ec" stroke="#bacbc3" stroke-width="2"/><text x="91" y="359" font-size="24" fill="#20342d" font-weight="400">Mika: Mondphase oder Mondfinsternis?</text><text x="91" y="393" font-size="24" fill="#20342d" font-weight="400">In E2 werden sie unterschieden.</text><rect x="24" y="458" width="505" height="77" rx="12" fill="#e5eaff" stroke="#bacbc3" stroke-width="2"/><text x="44" y="504" font-size="25" fill="#20342d" font-weight="400">Jona: Ich ändere die Überschrift.</text><text x="280" y="579" font-size="36" fill="#2d52ee" font-weight="700">↓</text><rect x="24" y="600" width="552" height="80" rx="12" fill="#fff" stroke="#bacbc3" stroke-width="2"/><text x="44" y="633" font-size="24" fill="#476056" font-weight="400">Nachher · Überschrift im Plan</text><text x="44" y="668" font-size="27" fill="#20342d" font-weight="700">Mondphase oder Mondfinsternis?</text></g></svg>
