<svg xmlns="http://www.w3.org/2000/svg" width="960" height="740" viewBox="0 0 960 740"><title>Jules ausgewählter Erfolg und getrennte Kontextkarte</title><rect x="0" y="0" width="960" height="740" rx="24" fill="#f5f3eb"/><rect x="32" y="30" width="896" height="675" rx="20" fill="white"/><text x="62" y="83" fill="#905731" font-family="Arial,sans-serif" font-size="26" font-weight="bold">JULES BEITRAG · ERFUNDEN</text><rect x="62" y="106" width="836" height="238" rx="14" fill="#e9f1eb"/><g transform="translate(330 133)"><path d="M0 140 L50 50 L100 140 L150 50 L200 140 L250 50 L300 140" fill="none" stroke="#548d82" stroke-width="14"/><path d="M45 50 H255" stroke="#274e4c" stroke-width="9"/><ellipse cx="115" cy="40" rx="26" ry="9" fill="#be963e"/><ellipse cx="153" cy="33" rx="26" ry="9" fill="#d9b456"/><ellipse cx="191" cy="40" rx="26" ry="9" fill="#be963e"/></g><text x="62" y="395" fill="#203c3b" font-family="Arial,sans-serif" font-size="34" font-weight="bold">Bei mir klappt alles sofort!</text><text x="62" y="442" fill="#203c3b" font-family="Arial,sans-serif" font-size="28">„Talent braucht keine Übung.“</text><rect x="62" y="482" width="836" height="153" rx="14" fill="#f8e1b5"/><text x="83" y="522" fill="#694924" font-family="Arial,sans-serif" font-size="24" font-weight="bold">ZUSATZKARTE · nicht im Beitrag sichtbar</text><text x="83" y="566" fill="#203c3b" font-family="Arial,sans-serif" font-size="27">Vorher: vier Versuche und Hilfe beim Falten.</text><text x="83" y="609" fill="#203c3b" font-family="Arial,sans-serif" font-size="27">Jetzt hält die fertige Brücke drei Münzen.</text><text x="60" y="681" fill="#53665f" font-family="Arial,sans-serif" font-size="21">Erfundener Unterrichtsfall · IuM-Lernwerk · CC BY-SA 4.0</text></svg>