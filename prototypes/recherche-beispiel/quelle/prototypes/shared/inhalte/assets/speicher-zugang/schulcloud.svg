<svg xmlns="http://www.w3.org/2000/svg" width="600" height="550" viewBox="0 0 600 550" role="img" aria-labelledby="title desc"><title id="title">B und C · Datei beim Schuldienst</title><desc id="desc">B und C speichern beim Schuldienst. Beide Schulgeräte können mit Verbindung und erlaubtem Zugang darauf zugreifen. B ist nur für Mia, C für Mia und die Klasse lesbar. Ohne Verbindung sind diese Dateien im Fall nicht verfügbar.</desc><rect width="600" height="550" rx="14" fill="#f9f7ef"/><g font-family="Arial, sans-serif"><text x="24" y="42" font-size="30" fill="#20342d" font-weight="700">Die Datei liegt beim Schuldienst</text><rect x="24" y="70" width="552" height="146" rx="12" fill="#e5f2ec" stroke="#bacbc3" stroke-width="2"/><text x="44" y="108" font-size="26" fill="#20342d" font-weight="700">Computer des Schuldienstes</text><rect x="44" y="124" width="205" height="64" rx="12" fill="#e5f2ec" stroke="#bacbc3" stroke-width="2"/><text x="56" y="164" font-size="24" fill="#20342d" font-weight="400">entwurf.txt</text><text x="278" y="155" font-size="24" fill="#20342d" font-weight="400">B: nur Mia</text><text x="278" y="189" font-size="24" fill="#20342d" font-weight="400">C: Mia + Klasse</text><text x="135" y="258" font-size="36" fill="#2d52ee" font-weight="700">↓</text><text x="433" y="258" font-size="36" fill="#2d52ee" font-weight="700">↓</text><rect x="24" y="280" width="552" height="122" rx="12" fill="#fff" stroke="#bacbc3" stroke-width="2"/><text x="44" y="321" font-size="26" fill="#20342d" font-weight="400">Gerät 1 und Gerät 2 öffnen die Datei</text><text x="44" y="355" font-size="26" fill="#20342d" font-weight="400">mit Verbindung und erlaubtem Zugang.</text><rect x="24" y="428" width="552" height="92" rx="12" fill="#fff0d9" stroke="#bacbc3" stroke-width="2"/><text x="44" y="465" font-size="24" fill="#20342d" font-weight="400">Ohne Verbindung: hier nicht verfügbar.</text><text x="44" y="499" font-size="24" fill="#20342d" font-weight="400">Keine zusätzliche Offline-Kopie im Fall.</text></g></svg>
