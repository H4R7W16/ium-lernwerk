<svg xmlns="http://www.w3.org/2000/svg" width="600" height="520" viewBox="0 0 600 520" role="img" aria-labelledby="title desc"><title id="title">Pause und Übergabe prüfen</title><desc id="desc">Bei kurzer Pause wird nach geprüfter Schulregel gesperrt und die Entsperrung geprüft. Bei Übergabe wird vorher gesichert und die betreffende Sitzung beendet. Ein dunkler Bildschirm oder geschlossener Tab beweist das nicht.</desc><rect width="600" height="520" rx="14" fill="#f9f7ef"/><g font-family="Arial, sans-serif"><text x="24" y="42" font-size="30" fill="#20342d" font-weight="700">Woran erkennst du den Schutz?</text><rect x="24" y="70" width="552" height="176" rx="12" fill="#e5f2ec" stroke="#bacbc3" stroke-width="2"/><text x="44" y="108" font-size="26" fill="#20342d" font-weight="700">Kurze Pause → vereinbart sperren</text><text x="44" y="153" font-size="26" fill="#20342d" font-weight="400">Arbeit kann offen bleiben.</text><text x="44" y="187" font-size="26" fill="#20342d" font-weight="400">Rückkehr braucht den geprüften</text><text x="44" y="221" font-size="26" fill="#20342d" font-weight="400">Entsperrweg der Schule.</text><rect x="24" y="274" width="552" height="176" rx="12" fill="#fff" stroke="#bacbc3" stroke-width="2"/><text x="44" y="312" font-size="26" fill="#20342d" font-weight="700">Übergabe → Sitzung beenden</text><text x="44" y="357" font-size="26" fill="#20342d" font-weight="400">Arbeit vorher sichern.</text><text x="44" y="391" font-size="26" fill="#20342d" font-weight="400">Im Schuldienst Abmeldung prüfen.</text><text x="44" y="425" font-size="26" fill="#20342d" font-weight="400">Geschlossener Tab genügt nicht.</text><text x="24" y="491" font-size="22" fill="#476056" font-weight="400">Dunkler Bildschirm allein beweist keinen Schutz.</text></g></svg>
