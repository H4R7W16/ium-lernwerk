<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="340" viewBox="0 0 1000 340" role="img" aria-labelledby="t d" font-family="Segoe UI,Arial,sans-serif"><title id="t">Daten speichern, übertragen und anzeigen</title><desc id="d">Qualitatives Modell: Ausgangsspeicher, Netz und Zielgerät. Ein Zielgerät zeigt Daten an; es kann sie auch speichern. Alle benötigen Technik und Energie, die Herstellung benötigt Rohstoffe. Es gibt hier keine Verbrauchswerte.</desc><rect width="1000" height="340" rx="14" fill="#f2f5f1"/><g fill="white" stroke="#245743" stroke-width="2"><rect x="30" y="70" width="270" height="140" rx="12"/><rect x="365" y="70" width="270" height="140" rx="12"/><rect x="700" y="70" width="270" height="140" rx="12"/></g><g fill="#222a2f" text-anchor="middle" font-size="26"><text x="165" y="113">Speicher</text><text x="165" y="158">Daten bereithalten</text><text x="500" y="113">Netz</text><text x="500" y="158">Bits übertragen</text><text x="835" y="113">Zielgerät</text><text x="835" y="158">anzeigen / speichern</text></g><path d="M310 140H350M340 130L350 140L340 150M645 140H685M675 130L685 140L675 150" fill="none" stroke="#245743" stroke-width="4"/><text x="30" y="260" font-size="23" fill="#222a2f">Technik braucht Energie; ihre Herstellung benötigt Rohstoffe.</text><text x="30" y="305" font-size="23" fill="#222a2f">Datenmenge allein ergibt keine feste Strom- oder CO₂-Zahl.</text></svg>